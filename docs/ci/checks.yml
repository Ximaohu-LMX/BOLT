name: Reproduction checks
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q
      - run: python -m compileall -q repro src job_experiments
      - run: bash run_all.sh --dry-run --dataset AUTHOR --budget A0 --method BOLT
      - run: for script in *.sh scripts/*.sh; do bash -n "$script"; done
